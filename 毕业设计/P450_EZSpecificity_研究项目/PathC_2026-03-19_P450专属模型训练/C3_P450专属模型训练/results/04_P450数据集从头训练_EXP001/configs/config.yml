# EXP001: P450 random_split baseline
# 4x RTX4090 DDP, original architecture, no modifications

num_cpus: 0
num_gpus: 1
root_dir: /root/rivermind-data/EZSpecificity
log: True
seed: 3407
n_runs: 1

data:
  tag: EXP001-p450-random-baseline
  representer: structure_sequence
  full_data: False
  fake_sequence_ratio: 0
  sample_weight:
    - 1.0
    - 1.0
  batch_size: 48
  max_substrate_length: 280
  max_enzyme_length: 1450
  features:
    - 'morgan'
    - 1024
    - 'grover_mean'
    - 4885
  atom_features:
    - 'grover'
    - 2400

transform:
  dist_noise: True
  cutoff: 10
  num_r_gaussian: 32
  k: 48

model:
  name: 'structure_sequence'
  use_gnn: True
  hidden_dim: 128
  feature_norm: False
  header:
    act_fn: 'relu'
    norm: True
    num_layers: 3
  graph:
    name: egnn
    hidden_dim: 128
    act_fn: relu
    num_layers: 3
    attention: True
    residual: True
    norm: layer
    mode: complex
  cross_attention:
    n_head: 8
    dropout: 0.9

training:
  gradient_clip_val: 8
  optimizer: 'adamW'
  warmup_epochs: 8
  lr: 3.0e-04
  weight_decay: 0
  min_lr: 5.0e-06
  sched_factor: 0.5
  sched_patience: 10
  val_frequency: 1
  accumulate_grad_batches: 1
