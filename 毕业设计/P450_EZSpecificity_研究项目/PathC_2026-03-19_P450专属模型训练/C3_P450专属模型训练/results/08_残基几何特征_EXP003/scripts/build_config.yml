num_cpus: 0
num_gpus: 1
root_dir: /root/autodl-tmp/EZSpecificity
log: True
seed: 3407
n_runs: 1

data:
  tag: p450-random-fold0
  representer: structure_sequence

  train_data_path:
    - /root/autodl-tmp/EZSpecificity/PathC/P450/data/splits/random/training_datas_0_pt.csv
  val_data_path:
    - /root/autodl-tmp/EZSpecificity/PathC/P450/data/splits/random/val_datas_0_pt.csv
  test_data_path:
    - /root/autodl-tmp/EZSpecificity/PathC/P450/data/splits/random/testing_datas_0_pt.csv

  enzyme_lmdb_path:
    - /root/autodl-tmp/EZSpecificity/PathC/P450/data/features/enzyme_features.lmdb
  reaction_lmdb_path:
    - /root/autodl-tmp/EZSpecificity/PathC/P450/data/features/reaction_features.lmdb
  grover_path:
    - /root/autodl-tmp/EZSpecificity/PathC/P450/data/features/grover_fingerprint.lmdb
  morgan_path:
    - /root/autodl-tmp/EZSpecificity/PathC/P450/data/features/morgan_fingerprint.npy
  structure_processed_path:
    - /root/autodl-tmp/EZSpecificity/PathC/P450/data/structure/structure_features_geom.lmdb
  sequence_processed_path:
    - /root/autodl-tmp/EZSpecificity/PathC/P450/data/structure/sequence_features.lmdb
  high_quality_id_path:
    - /root/autodl-tmp/EZSpecificity/PathC/P450/data/features/high_quality_id.txt

  pdb_dir: None
  ligand_dir: None
  full_data: False
  fake_sequence_ratio: 0
  sample_weight:
    - 1.0
    - 1.0
  batch_size: 48
  max_substrate_length: 280
  max_enzyme_length: 1450
  features:
    - 'morgan'
    - 1024
    - 'grover_mean'
    - 4885
  atom_features:
    - 'grover'
    - 2400

transform:
  dist_noise: True
  cutoff: 10
  num_r_gaussian: 32
  k: 48

model:
  name: 'structure_sequence'
  use_gnn: True
  hidden_dim: 128
  feature_norm: False
  header:
    act_fn: 'relu'
    norm: True
    num_layers: 3
  graph:
    name: egnn
    hidden_dim: 128
    act_fn: relu
    num_layers: 3
    attention: True
    residual: True
    norm: layer
    mode: complex
  cross_attention:
    n_head: 8
    dropout: 0.9

training:
  gradient_clip_val: 8
  optimizer: 'adamW'
  warmup_epochs: 8
  lr: 3.0e-04
  weight_decay: 0
  min_lr: 5.0e-06
  sched_factor: 0.5
  sched_patience: 10
  val_frequency: 1
  accumulate_grad_batches: 1
