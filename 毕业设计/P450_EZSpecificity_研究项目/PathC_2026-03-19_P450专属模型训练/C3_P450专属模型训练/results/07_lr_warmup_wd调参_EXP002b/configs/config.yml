# EXP002b: Learning rate tuning on Fe/heme baseline
# Based on EXP002a (Test AUC=0.7816), adjusting training hyperparameters:
#   lr: 3e-4 -> 4e-4 (linear scaling for effective batch 224 vs paper 64)
#   warmup: 8 -> 12 epochs (longer warmup for higher lr)
#   weight_decay: 0 -> 1e-5 (mild regularization)
#   sched_patience: 10 -> 8 (more aggressive lr reduction)
# Structure features: same as EXP002a (feature_dim=31, Fe+HEM+is_hetero)

num_cpus: 0
num_gpus: 1
root_dir: /root/rivermind-data/EZSpecificity
log: True
seed: 3407
n_runs: 1

data:
  tag: EXP002b-p450-lr-tuning
  representer: structure_sequence
  full_data: False
  fake_sequence_ratio: 0
  sample_weight:
    - 1.0
    - 1.0
  batch_size: 48
  max_substrate_length: 280
  max_enzyme_length: 1450
  features:
    - 'morgan'
    - 1024
    - 'grover_mean'
    - 4885
  atom_features:
    - 'grover'
    - 2400

transform:
  dist_noise: True
  cutoff: 10
  num_r_gaussian: 32
  k: 48

model:
  name: 'structure_sequence'
  use_gnn: True
  hidden_dim: 128
  feature_norm: False
  header:
    act_fn: 'relu'
    norm: True
    num_layers: 3
  graph:
    name: egnn
    hidden_dim: 128
    act_fn: relu
    num_layers: 3
    attention: True
    residual: True
    norm: layer
    mode: complex
  cross_attention:
    n_head: 8
    dropout: 0.9

training:
  gradient_clip_val: 8
  optimizer: 'adamW'
  warmup_epochs: 12
  lr: 4.0e-04
  weight_decay: 1.0e-05
  min_lr: 5.0e-06
  sched_factor: 0.5
  sched_patience: 8
  val_frequency: 1
  accumulate_grad_batches: 2
