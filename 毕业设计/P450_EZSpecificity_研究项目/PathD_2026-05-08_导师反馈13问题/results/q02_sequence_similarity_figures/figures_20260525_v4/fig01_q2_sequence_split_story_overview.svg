<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .ink { fill: #17212b; }
      .muted { fill: #667085; }
      .blue { fill: #2f5d8c; }
      .red { fill: #b64b4b; }
      .green { fill: #4f6f52; }
      .panel { fill: #fbfcfd; stroke: #d8dde5; stroke-width: 2; }
      .soft-blue { fill: #edf4fa; stroke: #2f5d8c; stroke-width: 2; }
      .soft-red { fill: #fff3f3; stroke: #b64b4b; stroke-width: 2; }
      .soft-purple { fill: #f5f1f8; stroke: #6b547f; stroke-width: 2; }
      .thin { stroke: #d8dde5; stroke-width: 2; }
      .nn { stroke: #b64b4b; stroke-width: 4; fill: none; stroke-linecap: round; }
      .dash-blue { stroke: #2f5d8c; stroke-width: 3; stroke-dasharray: 9 7; fill: #edf4fa; }
      .dash-purple { stroke: #6b547f; stroke-width: 3; stroke-dasharray: 9 7; fill: #f5f1f8; }
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "SimHei", Arial, sans-serif; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #667085; }
      .h2 { font-size: 24px; font-weight: 700; fill: #17212b; }
      .small { font-size: 15px; fill: #667085; }
      .label { font-size: 18px; font-weight: 700; fill: #17212b; }
      .note { font-size: 17px; fill: #17212b; }
      .metric { font-size: 20px; font-weight: 700; }
      .tiny { font-size: 13px; fill: #667085; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#667085"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>

  <text class="title ink" x="800" y="72" text-anchor="middle">Q2 序列相似度划分：模型是否真的能泛化到远缘酶？</text>
  <text class="subtitle" x="800" y="110" text-anchor="middle">把 train / val / test 从随机样本划分，改成按酶序列相似关系整体划分</text>

  <!-- Step labels -->
  <circle cx="158" cy="158" r="22" fill="#2f5d8c"/>
  <text x="158" y="165" text-anchor="middle" font-size="22" fill="#fff" font-weight="700">1</text>
  <text class="h2" x="198" y="166">随机划分：相似酶可能跨集合</text>

  <circle cx="600" cy="158" r="22" fill="#2f5d8c"/>
  <text x="600" y="165" text-anchor="middle" font-size="22" fill="#fff" font-weight="700">2</text>
  <text class="h2" x="640" y="166">EXP004：cluster 不拆开，但仍有跨 cluster 近邻</text>

  <circle cx="1110" cy="158" r="22" fill="#6b547f"/>
  <text x="1110" y="165" text-anchor="middle" font-size="22" fill="#fff" font-weight="700">3</text>
  <text class="h2" x="1150" y="166">EXP005：所有 NN60 近邻合并为组件</text>

  <!-- Panels -->
  <rect class="panel" x="80" y="200" width="400" height="390" rx="24"/>
  <rect class="panel" x="530" y="200" width="500" height="390" rx="24"/>
  <rect class="panel" x="1080" y="200" width="440" height="390" rx="24"/>

  <!-- Panel 1 random -->
  <rect class="soft-blue" x="140" y="282" width="170" height="64" rx="16"/>
  <text class="label blue" x="225" y="322" text-anchor="middle">train</text>
  <rect class="soft-red" x="330" y="282" width="105" height="64" rx="16"/>
  <text class="label red" x="382" y="322" text-anchor="middle">test</text>

  <circle cx="235" cy="410" r="34" fill="#fff" stroke="#2f5d8c" stroke-width="4"/>
  <text class="label" x="235" y="417" text-anchor="middle">E1</text>
  <circle cx="326" cy="315" r="31" fill="#fff" stroke="#2f5d8c" stroke-width="4"/>
  <text class="label" x="326" y="322" text-anchor="middle">E2</text>
  <circle cx="389" cy="392" r="31" fill="#fff" stroke="#b64b4b" stroke-width="4"/>
  <text class="label" x="389" y="399" text-anchor="middle">E3</text>
  <path class="nn" d="M333 338 C346 358 363 372 382 386" stroke-dasharray="9 7"/>
  <text class="red" x="285" y="250" font-size="19" font-weight="700">近缘酶可能同时出现在训练集和测试集</text>
  <rect class="soft-blue" x="145" y="485" width="270" height="62" rx="18"/>
  <text class="metric blue" x="280" y="510" text-anchor="middle">Test AUC 0.934</text>
  <text class="small" x="280" y="535" text-anchor="middle">随机划分分数偏乐观</text>

  <!-- Panel 2 cluster -->
  <rect class="dash-blue" x="585" y="278" width="155" height="150" rx="18"/>
  <rect class="dash-blue" x="805" y="278" width="155" height="150" rx="18"/>
  <text class="blue" x="662" y="265" text-anchor="middle" font-size="16" font-weight="700">cluster A</text>
  <text class="blue" x="882" y="265" text-anchor="middle" font-size="16" font-weight="700">cluster B</text>
  <circle cx="643" cy="355" r="30" fill="#fff" stroke="#2f5d8c" stroke-width="4"/>
  <text class="label" x="643" y="362" text-anchor="middle">E1</text>
  <circle cx="700" cy="355" r="30" fill="#fff" stroke="#2f5d8c" stroke-width="4"/>
  <text class="label" x="700" y="362" text-anchor="middle">E2</text>
  <circle cx="883" cy="355" r="30" fill="#fff" stroke="#2f5d8c" stroke-width="4"/>
  <text class="label" x="883" y="362" text-anchor="middle">E3</text>
  <path class="nn" d="M725 355 C772 335 820 335 858 355" stroke-dasharray="9 7"/>
  <text class="red" x="772" y="315" text-anchor="middle" font-size="18" font-weight="700">跨 cluster 仍可达到 NN60</text>
  <text class="small" x="772" y="452" text-anchor="middle">EXP004 只保证同一 cluster 不拆开</text>
  <rect class="soft-red" x="620" y="488" width="320" height="60" rx="16"/>
  <text class="metric red" x="780" y="513" text-anchor="middle">train-test NN60：19 对</text>
  <text class="small" x="780" y="538" text-anchor="middle">说明 cluster 边界仍不够严格</text>

  <!-- Panel 3 strict NN -->
  <rect class="dash-purple" x="1150" y="280" width="300" height="158" rx="20"/>
  <text x="1300" y="265" text-anchor="middle" font-size="17" fill="#6b547f" font-weight="700">strict NN60 组件</text>
  <circle cx="1215" cy="358" r="31" fill="#fff" stroke="#6b547f" stroke-width="4"/>
  <text class="label" x="1215" y="365" text-anchor="middle">E1</text>
  <circle cx="1300" cy="358" r="31" fill="#fff" stroke="#6b547f" stroke-width="4"/>
  <text class="label" x="1300" y="365" text-anchor="middle">E2</text>
  <circle cx="1385" cy="358" r="31" fill="#fff" stroke="#6b547f" stroke-width="4"/>
  <text class="label" x="1385" y="365" text-anchor="middle">E3</text>
  <path class="nn" d="M1246 358 L1269 358"/>
  <path class="nn" d="M1331 358 L1354 358"/>
  <text x="1300" y="462" text-anchor="middle" font-size="17" fill="#6b547f" font-weight="700">所有 NN60 连接合并，整组进入同一 split</text>
  <rect class="soft-purple" x="1166" y="488" width="270" height="60" rx="16"/>
  <text class="metric" x="1301" y="513" text-anchor="middle" fill="#6b547f">train-test NN60：0 对</text>
  <text class="small" x="1301" y="538" text-anchor="middle">Test AUC 降至 0.671</text>

  <!-- Bottom metric story -->
  <text class="h2" x="800" y="660" text-anchor="middle">测试表现随序列隔离变严格而下降</text>
  <line class="thin" x1="180" y1="740" x2="1425" y2="740" marker-end="url(#arrow)"/>

  <g>
    <circle cx="200" cy="740" r="13" fill="#fff" stroke="#2f5d8c" stroke-width="4"/>
    <text class="metric ink" x="200" y="704" text-anchor="middle">0.934</text>
    <text class="blue" x="200" y="780" text-anchor="middle" font-size="17">随机</text>
  </g>
  <g>
    <circle cx="470" cy="740" r="13" fill="#fff" stroke="#2f5d8c" stroke-width="4"/>
    <text class="metric ink" x="470" y="704" text-anchor="middle">0.808</text>
    <text class="blue" x="470" y="780" text-anchor="middle" font-size="17">id60 cluster</text>
  </g>
  <g>
    <circle cx="710" cy="740" r="13" fill="#fff" stroke="#2f5d8c" stroke-width="4"/>
    <text class="metric ink" x="710" y="704" text-anchor="middle">0.820</text>
    <text class="blue" x="710" y="780" text-anchor="middle" font-size="17">NN80</text>
  </g>
  <g>
    <circle cx="965" cy="740" r="13" fill="#fff" stroke="#b64b4b" stroke-width="4"/>
    <text class="metric ink" x="965" y="704" text-anchor="middle">0.671</text>
    <text class="red" x="965" y="780" text-anchor="middle" font-size="17">NN60</text>
  </g>
  <g>
    <circle cx="1235" cy="740" r="13" fill="#fff" stroke="#b64b4b" stroke-width="4"/>
    <text class="metric ink" x="1235" y="704" text-anchor="middle">0.638</text>
    <text class="red" x="1235" y="780" text-anchor="middle" font-size="17">NN40</text>
  </g>
  <text class="muted" x="1450" y="781" text-anchor="middle" font-size="17">更严格远缘</text>
  <text class="note" x="800" y="835" text-anchor="middle">结论：随机划分的高分不能直接代表远缘泛化能力；strict NN60 更贴近老师提出的 test-train &lt; 60% 要求。</text>
</svg>
