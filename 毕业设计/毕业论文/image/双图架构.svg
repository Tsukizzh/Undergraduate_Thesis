<svg viewBox="0 0 1760 820" xmlns="http://www.w3.org/2000/svg" width="1760" height="820">
        <defs>
          <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 Z" fill="#174677"></path>
          </marker>
          <marker id="a5g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 Z" fill="#B88A2B"></path>
          </marker>
          <marker id="a5r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 Z" fill="#C83A2A"></path>
          </marker>
        </defs>

        
        

        
        <g>
          <rect x="40" y="20" width="300" height="110" rx="6" fill="#FFE6C8" stroke="#B3792A" stroke-width="2"></rect>
          <text x="190" y="54" text-anchor="middle" font-family="Noto Sans SC" font-size="20" font-weight="700" fill="#7A4D12">① 酶的氨基酸序列</text>
          <text x="190" y="84" text-anchor="middle" font-family="Noto Sans SC" font-size="14" fill="#7A4D12">ESM-2 预训练嵌入</text>
          <text x="190" y="108" text-anchor="middle" font-family="Noto Sans SC" font-size="13" fill="#7A4D12" font-style="italic">每个氨基酸一个向量</text>
        </g>
        <g>
          <rect x="370" y="20" width="300" height="110" rx="6" fill="#DCE6F1" stroke="#4A6E95" stroke-width="2"></rect>
          <text x="520" y="54" text-anchor="middle" font-family="Noto Sans SC" font-size="20" font-weight="700" fill="#174677">② 对接复合物</text>
          <text x="520" y="84" text-anchor="middle" font-family="Noto Sans SC" font-size="14" fill="#174677">口袋原子 + 底物原子 + 键</text>
          <text x="520" y="108" text-anchor="middle" font-family="Noto Sans SC" font-size="13" fill="#174677" font-style="italic">原子级 · 只看距离</text>
        </g>
        <g>
          <rect x="700" y="20" width="300" height="110" rx="6" fill="#DFE9D6" stroke="#5E7A48" stroke-width="2"></rect>
          <text x="850" y="54" text-anchor="middle" font-family="Noto Sans SC" font-size="20" font-weight="700" fill="#3F5A2C">③ 底物 SMILES</text>
          <text x="850" y="84" text-anchor="middle" font-family="Noto Sans SC" font-size="14" fill="#3F5A2C">GROVER + Morgan 指纹</text>
          <text x="850" y="108" text-anchor="middle" font-family="Noto Sans SC" font-size="13" fill="#3F5A2C" font-style="italic">原子级 + 整分子级</text>
        </g>
        <g>
          <rect x="1030" y="20" width="300" height="130" rx="6" fill="#FFF4C9" stroke="#B88A2B" stroke-width="2"></rect>
          <text x="1180" y="44" text-anchor="middle" font-family="Noto Sans SC" font-size="18" font-weight="700" fill="#7A5A12">★ 酶 3D 结构（口袋）输入</text>
          <text x="1180" y="66" text-anchor="middle" font-family="Noto Sans SC" font-size="12" fill="#7A5A12"><tspan font-weight="700">节点</tspan>：每个残基 = (<tspan font-style="italic">s</tspan>, <tspan font-style="italic">V</tspan>) 元组</text>
          <text x="1180" y="84" text-anchor="middle" font-family="Noto Sans SC" font-size="11" fill="#4A5361"><tspan font-style="italic">s</tspan> = φ/ψ/ω 的 sin+cos (6维)</text>
          <text x="1180" y="100" text-anchor="middle" font-family="Noto Sans SC" font-size="11" fill="#4A5361"><tspan font-style="italic">V</tspan> = Cα→N/C/Cβ (3×3D)</text>
          <text x="1180" y="120" text-anchor="middle" font-family="Noto Sans SC" font-size="12" fill="#7A5A12"><tspan font-weight="700">边</tspan>：kNN k=30 · 距离 RBF + Cα-Cα 方向</text>
          <text x="1180" y="138" text-anchor="middle" font-family="Noto Sans SC" font-size="11" fill="#8A8F99" font-style="italic">新增通路 · 不破坏原模型</text>

        
        
        </g>

        
        <line x1="190" y1="132" x2="190" y2="168" stroke="#B3792A" stroke-width="2" marker-end="url(#a5)"></line>
        <line x1="520" y1="132" x2="520" y2="168" stroke="#4A6E95" stroke-width="2" marker-end="url(#a5)"></line>
        <line x1="850" y1="132" x2="850" y2="168" stroke="#5E7A48" stroke-width="2" marker-end="url(#a5)"></line>
        <line x1="1180" y1="148" x2="1180" y2="168" stroke="#B88A2B" stroke-width="2" marker-end="url(#a5g)"></line>

        
        <g>
          <rect x="40" y="170" width="300" height="120" rx="6" fill="#fff" stroke="#B3792A" stroke-width="2"></rect>
          <text x="190" y="206" text-anchor="middle" font-family="Noto Sans SC" font-size="18" font-weight="700" fill="#7A4D12">序列 encoder</text>
          <text x="190" y="232" text-anchor="middle" font-family="Noto Sans SC" font-size="14" fill="#4A5361">一层线性层 · LayerNorm</text>
          <text x="190" y="256" text-anchor="middle" font-family="Noto Sans SC" font-size="13" fill="#8A8F99" font-style="italic">残基级向量（酶）</text>
          <text x="190" y="278" text-anchor="middle" font-family="Noto Sans SC" font-size="13" fill="#8A8F99" font-style="italic">每残基 · 128 维</text>
        </g>
        <g>
          <rect x="370" y="170" width="300" height="120" rx="6" fill="#fff" stroke="#4A6E95" stroke-width="2"></rect>
          <text x="520" y="206" text-anchor="middle" font-family="Noto Sans SC" font-size="18" font-weight="700" fill="#174677">EGNN · 3 轮消息传递</text>
          <text x="520" y="232" text-anchor="middle" font-family="Noto Sans SC" font-size="14" fill="#4A5361">SE(3) 不变 · 仅距离标量</text>
          <text x="520" y="256" text-anchor="middle" font-family="Noto Sans SC" font-size="13" fill="#8A8F99" font-style="italic">底物原子级 + 全局摘要</text>
          <text x="520" y="278" text-anchor="middle" font-family="Noto Sans SC" font-size="13" fill="#8A8F99" font-style="italic">每原子 · 128 维</text>
        </g>
        <g>
          <rect x="700" y="170" width="300" height="120" rx="6" fill="#fff" stroke="#5E7A48" stroke-width="2"></rect>
          <text x="850" y="206" text-anchor="middle" font-family="Noto Sans SC" font-size="18" font-weight="700" fill="#3F5A2C">分子 encoder</text>
          <text x="850" y="232" text-anchor="middle" font-family="Noto Sans SC" font-size="14" fill="#4A5361">线性层 · LayerNorm</text>
          <text x="850" y="256" text-anchor="middle" font-family="Noto Sans SC" font-size="13" fill="#8A8F99" font-style="italic">原子级 + 整分子级</text>
          <text x="850" y="278" text-anchor="middle" font-family="Noto Sans SC" font-size="13" fill="#8A8F99" font-style="italic">128 维</text>
        </g>
        
        <g>
          <rect x="1030" y="170" width="300" height="120" rx="6" fill="#fff" stroke="#B88A2B" stroke-width="2"></rect>
          <text x="1180" y="206" text-anchor="middle" font-family="Noto Sans SC" font-size="18" font-weight="700" fill="#7A5A12">GVP encoder · 3 层</text>
          <text x="1180" y="232" text-anchor="middle" font-family="Noto Sans SC" font-size="14" fill="#1A1F26"><tspan font-weight="700" fill="#7A5A12">SE(3) 等变</tspan>：旋转口袋，输出&#34;跟着转&#34;</text>
          <text x="1180" y="254" text-anchor="middle" font-family="Noto Sans SC" font-size="13" fill="#4A5361">同时携带<tspan font-weight="700">标量</tspan>（长度）与<tspan font-weight="700">向量</tspan>（方向）</text>
          <text x="1180" y="278" text-anchor="middle" font-family="Noto Sans SC" font-size="12" fill="#8A8F99" font-style="italic">残基级 · 256 维 · 借鉴 EnzymeCAGE</text>
        </g>

        
        <line x1="1180" y1="292" x2="1180" y2="322" stroke="#B88A2B" stroke-width="2" marker-end="url(#a5g)"></line>
        <g>
          <rect x="1040" y="324" width="280" height="62" rx="6" fill="#FFF4C9" stroke="#B88A2B" stroke-width="2.2"></rect>
          <text x="1180" y="352" text-anchor="middle" font-family="Noto Sans SC" font-size="17" font-weight="700" fill="#7A5A12">残基级 3D 特征中枢 h_res</text>
          <text x="1180" y="374" text-anchor="middle" font-family="Noto Sans SC" font-size="13" fill="#7A5A12">每个口袋残基 · 256 维（同时供两条旁路使用）</text>
        </g>

        
        <line x1="190" y1="290" x2="190" y2="496" stroke="#B3792A" stroke-width="2" marker-end="url(#a5)"></line>
        <line x1="520" y1="290" x2="520" y2="496" stroke="#4A6E95" stroke-width="2" marker-end="url(#a5)"></line>
        <line x1="850" y1="290" x2="850" y2="496" stroke="#5E7A48" stroke-width="2" marker-end="url(#a5)"></line>

        
        
        <path d="M 1040 355 L 1010 355 L 1010 475 L 190 475" fill="none" stroke="#C83A2A" stroke-width="2.2" stroke-dasharray="6 4"></path>
        <line x1="190" y1="475" x2="190" y2="428" stroke="#C83A2A" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#a5r)"></line>
        
        <g>
          <circle cx="190" cy="412" r="14" fill="#FFF" stroke="#C83A2A" stroke-width="2.4"></circle>
          <text x="190" y="418" text-anchor="middle" font-family="Noto Sans SC" font-size="17" font-weight="800" fill="#C83A2A">+</text>
        </g>
        <text x="212" y="408" font-family="Noto Sans SC" font-size="12.5" fill="#C83A2A" font-weight="700">加到序列特征上</text>

        
        <g>
          <rect x="380" y="398" width="540" height="62" rx="6" fill="#FFF1EA" stroke="#C83A2A" stroke-width="1.8" stroke-dasharray="6 4"></rect>
          <text x="650" y="426" text-anchor="middle" font-family="Noto Sans SC" font-size="17" font-weight="700" fill="#C83A2A">出口 1 · 深融合（回灌序列）</text>
          <text x="650" y="448" text-anchor="middle" font-family="Noto Sans SC" font-size="13" fill="#4A5361">线性层 256→128 · ★ 权重 <tspan font-weight="700" fill="#C83A2A">零初始化</tspan> · 训练起步贡献为 0 · 仅在需要时&#34;逐步打开&#34;深融合</text>
        </g>

        
        <g>
          <rect x="1040" y="420" width="280" height="62" rx="6" fill="#FDF7E8" stroke="#B88A2B" stroke-width="1.8" stroke-dasharray="5 4"></rect>
          <text x="1180" y="448" text-anchor="middle" font-family="Noto Sans SC" font-size="17" font-weight="700" fill="#7A5A12">出口 2 · 浅旁路</text>
          <text x="1180" y="470" text-anchor="middle" font-family="Noto Sans SC" font-size="13" fill="#4A5361">残基均值池化 · 压到 128 维 · 直接进入拼接</text>
        </g>
        
        <line x1="1180" y1="386" x2="1180" y2="418" stroke="#B88A2B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a5g)"></line>

        
        
        <g>
          <rect x="60" y="498" width="1000" height="64" rx="6" fill="#174677"></rect>
          <text x="560" y="531" text-anchor="middle" font-family="Noto Sans SC" font-size="20" font-weight="700" fill="#fff">⑤ 双向交叉注意力（酶残基 ⇄ 底物原子）</text>
          <text x="560" y="552" text-anchor="middle" font-family="Noto Sans SC" font-size="13" fill="#DCE6F1">8 头 · Dropout 90%</text>
        </g>
        
        <line x1="560" y1="564" x2="560" y2="594" stroke="#174677" stroke-width="2" marker-end="url(#a5)"></line>

        
        <g>
          <rect x="60" y="596" width="1340" height="64" rx="6" fill="#fff" stroke="#174677" stroke-width="2"></rect>
          <text x="730" y="624" text-anchor="middle" font-family="Noto Sans SC" font-size="17" font-weight="700" fill="#174677">拼接 8 个 128 维向量 → 一个 1024 维综合向量</text>
          <text x="730" y="648" text-anchor="middle" font-family="Noto Sans SC" font-size="13" fill="#4A5361">原有 7 个（酶 / 底物 / 双向注意力 / 全局结构 / 整分子 / 指纹） + 新增 1 个（残基级摘要）</text>
        </g>

        
        <path d="M 1180 482 L 1180 592" fill="none" stroke="#B88A2B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a5g)"></path>

        
        <line x1="730" y1="662" x2="730" y2="692" stroke="#174677" stroke-width="2" marker-end="url(#a5)"></line>
        <g>
          <rect x="540" y="694" width="380" height="44" rx="6" fill="#174677"></rect>
          <text x="730" y="722" text-anchor="middle" font-family="Noto Sans SC" font-size="17" font-weight="700" fill="#fff">预测头 MLP · 1024 → 128 → 128 → 1</text>
        </g>
        <line x1="730" y1="740" x2="730" y2="770" stroke="#174677" stroke-width="2" marker-end="url(#a5)"></line>
        <g>
          <rect x="620" y="772" width="220" height="44" rx="6" fill="#D5AF6E"></rect>
          <text x="730" y="800" text-anchor="middle" font-family="Noto Sans SC" font-size="17" font-weight="700" fill="#fff">logits → σ（概率）</text>
        </g>

      </svg>